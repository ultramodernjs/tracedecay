[package]
name = "tracedecay-daemon-service"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon invocation dispatch, project runtimes, and payload handlers for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Cross-crate fixture surface for composition-root invocation tests:
# `DaemonInvocationService::invoke`, publication gates, and test constructors.
# Production code is never gated by this feature.
test-helpers = []
# The pluggable memory-provider host (Native/NCM mount in `retained_owner`).
# The composition root forwards its public host feature here; builds without
# it pull no provider code or NCM runtime.
memory-provider-host = [
    "dep:chrono",
    "dep:fs2",
    "tracedecay-rusqlite-runtime/recall-admission",
    "dep:tracedecay-memory-provider-registry",
    "dep:tracedecay-memory-provider-ncm",
    "dep:tracedecay-memory-observation",
    "dep:tracedecay-memory-hygiene",
    "dep:tracedecay-temporal-query",
]

[dependencies]
asupersync = { workspace = true, features = ["tls"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracedecay-daemon-control = { path = "../tracedecay-daemon-control" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-project = { path = "../tracedecay-project" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime" }
tracedecay-maintenance = { path = "../tracedecay-maintenance" }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention" }
tracedecay-session-runtime = { path = "../tracedecay-session-runtime" }
axum.workspace = true
getrandom.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
fs2 = { version = "0.4", optional = true }
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-api = { path = "../tracedecay-api" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-host-admission = { path = "../tracedecay-host-admission" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-memory-provider-registry = { path = "../tracedecay-memory-provider-registry", optional = true }
tracedecay-memory-provider-ncm = { path = "../tracedecay-memory-provider-ncm", optional = true, features = ["rust-backend"] }
tracedecay-memory-observation = { path = "../tracedecay-memory-observation", optional = true }
tracedecay-memory-hygiene = { path = "../tracedecay-memory-hygiene", optional = true }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-query = { path = "../tracedecay-query" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", optional = true }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-source-edit = { path = "../tracedecay-source-edit" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-application = { path = "../tracedecay-application" }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.1", default-features = false }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", features = ["test-helpers"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# The real provider fixture installs its model through the canonical encoder.
tracedecay-memory-ncm-runtime = { path = "../tracedecay-memory-ncm-runtime", default-features = false, features = ["real-encoder"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
# Provider-neutral conformance fixtures for the mounted provider journey tests.
tracedecay-memory-conformance = { path = "../tracedecay-memory-conformance" }
# The moved lifecycle/doctor tests open projects through the registered test
# runtime and pin the profile data directory.
tracedecay-project = { path = "../tracedecay-project", features = ["test-helpers"] }
