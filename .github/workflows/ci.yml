name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI for {0}', github.ref_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [master, feature/holographic-memory]
  workflow_dispatch:

permissions:
  contents: read

# Non-master refs cancel superseded
# runs for tip-fast feedback. Master finishes the in-progress snapshot so a
# green/red signal still lands when merges outpace the long pole; GitHub
# keeps only the newest pending tip. Shorter shards cut how long that tip
# may wait for first job — shard layout is owned elsewhere.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # Every job records the same value in MODULE.bazel.lock, so a saved
  # lockfile matches every later job (see setup-bazel).
  CARGO_BAZEL_TIMEOUT: "3600"

jobs:
  # Drafts run cheap gates. Ready PRs, pushes and dispatches run everything:
  # Linux, macOS and Windows tests and the stock host journeys.
  scope-gate:
    name: Scope gate
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      run-heavy: ${{ steps.decide.outputs.run-heavy }}
      run-os: ${{ steps.decide.outputs.run-os }}
      run-hosts: ${{ steps.decide.outputs.run-hosts }}
    steps:
      - name: Decide what this run may spend
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          heavy=true
          if [[ $EVENT == pull_request && $DRAFT == true ]]; then
            heavy=false
          fi
          os=$heavy
          hosts=$heavy
          {
            echo "run-heavy=$heavy"
            echo "run-os=$os"
            echo "run-hosts=$hosts"
          } >>"$GITHUB_OUTPUT"
          echo "run-heavy=$heavy run-os=$os run-hosts=$hosts (event=$EVENT)"

  # One dev-profile `tracedecay` binary for the stock host integrations.
  debug-cli:
    name: Build debug CLI
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-hosts == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_ARM_RUNNER || 'ubuntu-26.04-arm' }}
    timeout-minutes: 90
    env:
      # Bazel's C++ autoconfig picks ld.gold on Ubuntu 24.04 images, and gold
      # cannot place aarch64 branch stubs in this debug binary ("Stub is too
      # far away"). These options follow the detected -fuse-ld, so bfd wins.
      BAZEL_LINKOPTS: -fuse-ld=bfd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build tracedecay binary
        uses: ./.github/actions/build-cli
        with:
          config: ci
          dest: target/debug
          cache-key: ci-linux-arm64
          # The only arm64 Linux Bazel job here, so it seeds that lockfile.
          save-module-lockfile: "true"

      - name: Publish the binary for the host integration jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug/tracedecay
          if-no-files-found: error
          retention-days: 1

  benchmark-harness:
    name: Benchmark harness self-tests
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runtime benchmark harness produces the evidence PRs cite; its own
      # unit tests only count if something runs them.
      - name: Test the runtime benchmark harness
        working-directory: benchmark_data/runtime
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test benchmark result publication
        run: python3 scripts/test-claude-observation-benchmark-publication.py

  # The cheap repository gates in one job: commit lint, cache lineage, the
  # release guards, and rustfmt. Each used to hold its own ubuntu-latest
  # runner for a couple of minutes of work; on 20 free slots that is three
  # queue entries per push doing what one does.
  gates:
    permissions:
      contents: read
      id-token: write
    name: Repository gates
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: ./.github/actions/setup-pnpm

      # Reject invalid commit messages before fetching toolchains or running
      # repository-wide checks, without rejudging published history.
      - name: Validate commit messages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/lint-ci-commits.sh

      - name: Reject tracked ignored files
        run: scripts/check-release-pr-integrity.sh HEAD HEAD

      # Same entrypoint the pre-push hook runs, so local and CI checks match.
      - name: Run the local pre-push gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          scripts/local-gates.sh rustfmt-range "$base" HEAD
          scripts/local-gates.sh whitespace-range "$base" HEAD
          scripts/local-gates.sh repo

      - name: Test bounded commit range linting
        run: python3 scripts/test-lint-commit-range.py

      - name: Test Windows checkout preserves generated and embedded bytes
        run: python3 scripts/test-checkout-bytes.py

      - name: Test worktree GC classification and build reclamation
        run: python3 scripts/test-worktree-gc.py

      - name: Test Bazel workspace provenance
        run: python3 scripts/test-bazel-workspace-status.py

      - name: Test Bazel default-feature alias collapse
        run: python3 scripts/test-gen-builds-default-alias.py

      - name: Test the real-repository hot-path benchmark harness
        run: python3 scripts/test-bench-hot-paths.py

      - name: Test the unused tool-context matching rules
        run: python3 scripts/test-measure-unused-tool-context.py

      # Configure the output base and restore caches before the first Bazel
      # invocation so this job does not start two independent Bazel servers.
      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-format-linux
          tailscale-client-id: ${{ github.repository == 'ScriptedAlchemy/tracedecay' && github.actor_id == '25274700' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TS_BAZEL_CLIENT_ID || '' }}

      - name: Test the ranked-tail trim replay against the Rust rule cases
        run: bazel run //scripts:test-measure-ranked-tail-trim.py

      - name: Test the Hermes dashboard embed helpers
        run: python3 -m unittest discover -s dashboard/hermes-wrapper -p 'test_*.py'

      - name: Check Rust cache key lineage and the superseded-entry selection
        run: |
          python3 scripts/test-prune-superseded-actions-caches.py
          python3 scripts/test-rust-cache-lineage.py
          python3 scripts/check-rust-cache-lineage.py

      # Packager unit tests. They do not need a release binary, so they run
      # once here instead of once per release matrix target.
      - name: Test release packagers
        run: |
          python3 scripts/test-check-packaged-lsp-bridge.py
          python3 scripts/test-build-mcpb.py
          python3 scripts/test-resolve-installed-binary.py
          python3 scripts/test-check-packaged-mcp-stdio.py
          bazel test --config=ci //scripts:distribution_feature_wiring_test --test_output=errors
          python3 scripts/test-resolve-release-source-profile.py
          python3 scripts/test-package-release-archive.py
          python3 scripts/test-plan-release-recovery.py
          python3 scripts/test-check-release-artifacts.py
          python3 scripts/test-update-release-checksums.py
          python3 scripts/test-neutralize-release-pr-closing-keywords.py
          bash scripts/test-check-distribution-clean-source.sh
          bash scripts/test-check-distribution-snapshot.sh
          bash scripts/test-check-distribution-reuse.sh
          bash tests/macos_stable_codesign_test.sh

      # Exercise the release guard scripts when admitting proposed changes.
      - name: Check the release guards
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          bash tests/release_drift_check_test.sh
          bash tests/release_safety_test.sh
          bash tests/install_script_test.sh
          bash tests/release_pr_integrity_test.sh
          bash tests/dashboard_bundle_check_test.sh
          bash tests/dashboard_digests_check_test.sh

      - name: Check formatting
        run: bazel build --config=ci //:rustfmt_check

      - name: Save the Bazel module lockfile
        if: steps.bazel.outputs.module-lockfile-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MODULE.bazel.lock
          key: ${{ steps.bazel.outputs.module-lockfile-key }}

      # Manifest edits that skip a gen_builds.py rerun leave stale BUILD
      # files; compare the committed files against a fresh generation.
      - name: Check generated Bazel BUILD files are current
        run: bazel run //scripts:bazel/gen_builds.py -- --check

      - name: Test and check dev skill host copies
        run: |
          python3 scripts/test-check-dev-skill-mirrors.py
          python3 scripts/check-dev-skill-mirrors.py check

      # Every SQLite connection plans with SQLITE_DBCONFIG_ENABLE_QPSG, so a
      # bound partial-index predicate or LIKE pattern silently scans.
      - name: Test and check SQL plans stay index-backed under QPSG
        run: |
          python3 scripts/test-check-sqlite-plan-stability.py
          python3 scripts/check-sqlite-plan-stability.py

      # `daemon run` drives its futures on native workers, which have no
      # ambient Tokio runtime; production code names its Tokio handle.
      - name: Test and check production code has no ambient Tokio call
        run: |
          python3 scripts/test-check-ambient-tokio.py
          python3 scripts/check-ambient-tokio.py

      - name: Test and check rusqlite stays inside storage owners
        run: |
          python3 scripts/test-check-rusqlite-storage-boundary.py
          python3 scripts/check-rusqlite-storage-boundary.py

  # The macOS and Windows lanes run the same Bazel workspace the Linux
  # authority does: they exercise target-specific behavior the
  # Linux lane cannot prove.
  macos-test:
    name: Test macOS (${{ matrix.shard }})
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-os == 'true' }}
    runs-on: ${{ vars.DEPOT_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 330
    # Depot admits macOS jobs slowly (run 38652711787's four shards started
    # 29 to 65 minutes into the run) and every job pays setup and a binary
    # build, so macOS runs two shards whose union is the workspace: the
    # root crate, and everything else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: root
            targets: >-
              --
              //crates/tracedecay/...
              -//crates/tracedecay:dashboard_api_test
              -//crates/tracedecay:daemon_suite
          - shard: workspace
            targets: >-
              --
              //...
              -//crates/tracedecay/...
              //crates/tracedecay:dashboard_api_test
              //crates/tracedecay:daemon_suite
    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Hosted macOS images ran out of disk mid-build; Depot's start with
      # about 177 GiB free, where deleting ten Xcode copies took three
      # minutes per job for nothing (run 38644661902).
      - name: Remove inactive Xcode installations when disk is short
        shell: bash
        run: |
          df -h /
          python3 - <<'PYTHON'
          import pathlib
          import shutil
          import subprocess

          free_gib = shutil.disk_usage("/").free / 2**30
          if free_gib >= 100:
              print(f"{free_gib:.0f} GiB free; keeping the installed Xcode applications.", flush=True)
              raise SystemExit(0)
          applications = pathlib.Path("/Applications")
          selected = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
          active = next((path for path in selected.parents if path.suffix == ".app"), None)
          if active is None:
              raise SystemExit(f"Selected developer directory is not an Xcode application: {selected}")
          print(f"Selected Xcode before cleanup: {active}", flush=True)
          inactive = [path for path in applications.glob("Xcode*.app") if path.resolve() != active]
          for path in inactive:
              print(f"Removing inactive Xcode: {path}", flush=True)
              subprocess.run(["sudo", "rm", "-rf", "--", str(path)], check=True)
          after = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
          if after != selected:
              raise SystemExit(f"Selected developer directory changed: {selected} -> {after}")
          print(f"Selected Xcode after cleanup: {active}", flush=True)
          PYTHON
          df -h /

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-macos-test
          save-download-caches: ${{ matrix.shard == 'root' }}

      # Materialize build outputs before deadline-bearing tests: remote-cache
      # downloads otherwise compete for disk even with HOST_CPUS reserved.
      # ort-sys needs an explicit cache directory in Depot's macOS sandbox.
      - name: Build this shard's test binaries
        id: build
        shell: bash
        run: >-
          bazel build --config=ci --action_env=ORT_CACHE_DIR=/tmp/ort.pyke.io
          --profile="${{ runner.temp }}/bazel-build-profile.json.gz"
          ${{ matrix.targets }}

      # Save right after the build: a failing test later in the job must
      # not discard the four-minute crate_universe splice.
      - name: Save the Bazel module lockfile
        if: matrix.shard == 'root' && steps.bazel.outputs.module-lockfile-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MODULE.bazel.lock
          key: ${{ steps.bazel.outputs.module-lockfile-key }}

      - name: Build and test this shard
        shell: bash
        run: >-
          bazel test --config=ci --action_env=ORT_CACHE_DIR=/tmp/ort.pyke.io
          --profile="${{ runner.temp }}/bazel-test-profile.json.gz"
          ${{ matrix.targets }}

      - name: Upload Bazel execution profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-build-profile.json.gz
            ${{ runner.temp }}/bazel-test-profile.json.gz
          retention-days: 7

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      # Both macOS shards restore this prefix; root alone saves compiled
      # actions so matrix jobs cannot race the same Actions cache key.
      - name: Save compiled Bazel actions
        if: always() && !cancelled() && (github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && matrix.shard == 'root' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # Preserves the "Test macOS" check name for branch protection.
  macos-test-result:
    name: Test macOS
    needs: [scope-gate, macos-test]
    if: ${{ always() && needs.scope-gate.outputs.run-os == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every macOS test shard
        run: test "${{ needs.macos-test.result }}" = "success"

  # Every Rust suite inherits the HOST_CPUS reservation from .bazelrc to
  # account for its libtest worker pool.
  # cli + code-index share one critical path (65m on a warm v2 cache, run
  # 38071732620), so they keep the workspace-code shard. One shared
  # ci-linux-test-v2 prefix; root-b alone saves (a 6.9 GiB second family
  # previously evicted the budget). root-b and workspace catch unlisted
  # targets in their groups. root-a and root-b split the root crate's
  # suite time evenly (run 38689933223: about 330 s each on Linux, 550-600 s
  # on Windows); unit_test stays in root-b so only one shard compiles it.
  linux-test:
    permissions:
      contents: read
      id-token: write
    name: Test Linux (${{ matrix.shard }})
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: root-a
            targets: >-
              //crates/tracedecay:mcp_suite
              //crates/tracedecay:storage_suite
              //crates/tracedecay:transport_acceptance_suite
              //crates/tracedecay:session_suite
              //crates/tracedecay:automation_runner_test
              //crates/tracedecay:transcript_ingest_suite
          - shard: root-b
            targets: >-
              --
              //crates/tracedecay/...
              -//crates/tracedecay:mcp_suite
              -//crates/tracedecay:dashboard_api_test
              -//crates/tracedecay:daemon_suite
              -//crates/tracedecay:storage_suite
              -//crates/tracedecay:transport_acceptance_suite
              -//crates/tracedecay:session_suite
              -//crates/tracedecay:automation_runner_test
              -//crates/tracedecay:transcript_ingest_suite
          - shard: workspace-code
            targets: >-
              --
              //crates/tracedecay-cli/...
              //crates/tracedecay-code-extraction/...
              //crates/tracedecay-code-index/...
              //crates/tracedecay-code-index-retention/...
              //crates/tracedecay-code-index-runtime/...
          # Everything outside the root crate except the cli and code-index
          # group, plus the two root suites that finished root-a's queue.
          # Root-a ran its suites one at a time for eleven minutes on Linux
          # (run 38652711787) while this shard's tests took about one.
          - shard: workspace
            targets: >-
              --
              //...
              -//crates/tracedecay/...
              -//crates/tracedecay-cli/...
              -//crates/tracedecay-code-extraction/...
              -//crates/tracedecay-code-index/...
              -//crates/tracedecay-code-index-retention/...
              -//crates/tracedecay-code-index-runtime/...
              //crates/tracedecay:dashboard_api_test
              //crates/tracedecay:daemon_suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The workspace build plus its test outputs outgrow the runner's free
      # space (run 37403143722 died with ENOSPC mid-test); drop preinstalled
      # SDKs this job never uses.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          status=0
          sudo rm -rf /usr/local/lib/android &
          p1=$!
          sudo rm -rf /usr/share/dotnet &
          p2=$!
          sudo rm -rf /opt/ghc &
          p3=$!
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          p4=$!
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || status=1
          done
          df -h /
          exit "$status"

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-linux-test-v2
          # Tailscale independently checks this repository and immutable actor
          # ID. This condition avoids requesting credentials for fork PRs.
          tailscale-client-id: ${{ github.repository == 'ScriptedAlchemy/tracedecay' && github.actor_id == '25274700' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TS_BAZEL_CLIENT_ID || '' }}
          # Prefer v2; keep legacy prefixes as restore fallbacks if still present.
          extra-restore-keys: ci-linux-test,ci-linux-workspace-test
          save-download-caches: ${{ matrix.shard == 'root-b' }}

      # Every shard runs latency-sensitive daemon journeys. Finish their
      # compilation before testing so compiler work cannot consume that budget.
      - name: Build this shard's test binaries
        run: >-
          bazel build --config=ci
          --profile="${{ runner.temp }}/bazel-build-profile.json.gz"
          ${{ matrix.targets }}

      - name: Build and test this shard
        run: >-
          bazel test --config=ci
          --profile="${{ runner.temp }}/bazel-test-profile.json.gz"
          ${{ matrix.targets }}

      - name: Upload Bazel execution profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-build-profile.json.gz
            ${{ runner.temp }}/bazel-test-profile.json.gz
          retention-days: 7

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      # Matrix shards share github.job, so they would race the same save key.
      # One writer keeps the 10 GiB Actions cache from holding several copies
      # that would evict this prefix (observed: 6.9 GiB workspace-only save).
      # PR merge-ref caches let later pushes to the same PR reuse this build.
      - name: Save compiled Bazel actions
        if: always() && !cancelled() && (github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && matrix.shard == 'root-b' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # Preserves the "Test Linux" check name for branch protection.
  linux-test-result:
    name: Test Linux
    needs: [scope-gate, linux-test]
    if: ${{ always() && !cancelled() && needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every Linux test shard
        run: test "${{ needs.linux-test.result }}" = "success"

  # Three shards: the whole-workspace job ran its test tail strictly one
  # suite at a time (mcp_suite alone held the runner for eleven minutes), so
  # the root crate's suites split across root-a and root-b by measured run
  # time, as on Linux, and the workspace shard, whose own tests take about
  # four minutes, also runs the daemon and dashboard suites.
  windows-test:
    name: Windows checks (${{ matrix.shard }})
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: root-a
            targets: >-
              //crates/tracedecay:mcp_suite
              //crates/tracedecay:storage_suite
              //crates/tracedecay:transport_acceptance_suite
              //crates/tracedecay:session_suite
              //crates/tracedecay:automation_runner_test
              //crates/tracedecay:transcript_ingest_suite
          - shard: root-b
            targets: >-
              --
              //crates/tracedecay/...
              -//crates/tracedecay:mcp_suite
              -//crates/tracedecay:dashboard_api_test
              -//crates/tracedecay:daemon_suite
              -//crates/tracedecay:storage_suite
              -//crates/tracedecay:transport_acceptance_suite
              -//crates/tracedecay:session_suite
              -//crates/tracedecay:automation_runner_test
              -//crates/tracedecay:transcript_ingest_suite
          - shard: workspace
            targets: >-
              --
              //...
              -//crates/tracedecay/...
              //crates/tracedecay:dashboard_api_test
              //crates/tracedecay:daemon_suite
    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tune Windows runner for build and test I/O
        uses: ./.github/actions/tune-windows-runner
        with:
          redirect-temp: "true"

      # All Windows shards restore this prefix; the workspace shard alone
      # saves the download caches so matrix jobs cannot race one cache key.
      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-windows-test
          save-download-caches: ${{ matrix.shard == 'workspace' }}

      # Check the shipped MSVC target without linking test executables or
      # applying Linux's Clippy warning policy to this compiler-only check.
      # One shard covers the whole workspace; the others have nothing to add.
      - name: Compile the Windows workspace
        id: compile
        if: ${{ needs.scope-gate.outputs.run-os != 'true' && matrix.shard == 'workspace' }}
        shell: bash
        run: >-
          bazel build --config=ci
          --aspects=@rules_rust//rust:defs.bzl%rust_clippy_aspect
          --output_groups=clippy_checks
          --@rules_rust//rust/settings:clippy_flag=-Aclippy::all
          //...

      # Materialize build outputs before deadline-bearing tests: a test that
      # reserves HOST_CPUS otherwise parks the remaining compiles behind it
      # for its whole run.
      - name: Build this shard's test binaries
        id: build
        if: ${{ needs.scope-gate.outputs.run-os == 'true' }}
        shell: bash
        run: >-
          bazel build --config=ci
          --profile="${{ runner.temp }}/bazel-build-profile.json.gz"
          ${{ matrix.targets }}

      # Save right after the build: a failing test later in the job must
      # not discard the four-minute crate_universe splice.
      - name: Save the Bazel module lockfile
        if: matrix.shard == 'workspace' && steps.bazel.outputs.module-lockfile-hit != 'true' && (steps.compile.outcome == 'success' || steps.build.outcome == 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: MODULE.bazel.lock
          key: ${{ steps.bazel.outputs.module-lockfile-key }}

      - name: Build and test this shard
        if: ${{ needs.scope-gate.outputs.run-os == 'true' }}
        shell: bash
        run: >-
          bazel test --config=ci
          --profile="${{ runner.temp }}/bazel-test-profile.json.gz"
          ${{ matrix.targets }}

      - name: Upload Bazel execution profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-build-profile.json.gz
            ${{ runner.temp }}/bazel-test-profile.json.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      # The workspace shard alone saves compiled actions so matrix jobs
      # cannot race the same Actions cache key.
      - name: Save compiled Bazel actions
        if: always() && !cancelled() && (github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && matrix.shard == 'workspace' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # Preserves the "Windows checks" check name for branch protection.
  windows-test-result:
    name: Windows checks
    needs: [scope-gate, windows-test]
    if: ${{ always() && !cancelled() && needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every Windows shard
        run: test "${{ needs.windows-test.result }}" = "success"

  # Blocking Clippy policy over every Bazel Rust target, the
  # `cargo clippy --workspace --all-targets -D warnings` equivalent.
  clippy:
    permissions:
      contents: read
      id-token: write
    name: Clippy
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    # Same image as Test Linux so rustc action keys can restore that job's
    # disk cache (proc-macros, build scripts, grammar cc, matching rlibs)
    # when this job's own prefix misses. ARM isolated Clippy from that
    # cache and paid a cold 55–61m `//...` on recent PRs.
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-linux-clippy
          # Tailscale independently checks this repository and immutable actor
          # ID. This condition avoids requesting credentials for fork PRs.
          tailscale-client-id: ${{ github.repository == 'ScriptedAlchemy/tracedecay' && github.actor_id == '25274700' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TS_BAZEL_CLIENT_ID || '' }}
          extra-restore-keys: ci-linux-test-v2

      - name: Run blocking Clippy policy
        run: bazel build --config=ci --config=clippy //...

      - name: Save compiled Bazel actions
        if: always() && !cancelled() && github.ref == 'refs/heads/master' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # The production feature graph must exclude test-only surfaces. The
  # feature-gated variants themselves (every `test-transport` library and the
  # lean `--no-default-features` root, emitted by scripts/bazel/gen_builds.py)
  # are ordinary `//...` targets that the Clippy job compiles.
  feature-gates:
    name: Feature gates
    needs: [scope-gate, gates]
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    # x86 shares the pnpm store Repository gates and Dashboard already warm.
    # ubuntu-26.04-arm missed that cache on run 37707017494 and spent 325s
    # in `pnpm install` for an 8s `cargo tree`.
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # One graph walk per push. The release resolver repeats it on the tag it
      # builds, since a release is dispatched without waiting on this run.
      - name: Check the production feature graph
        run: python3 scripts/check-production-feature-profile.py

  # The configuration users actually receive: the release build of
  # `tracedecay-cli`, whose default features are `production`. Nothing else on
  # a push compiles it, so a break confined to the release graph (the
  # mimalloc allocator, the embedded dashboard, opt-level 3) would otherwise
  # first appear while a release is being cut.
  shipped-cli:
    permissions:
      contents: read
      id-token: write
    name: Shipped CLI build (x86_64-linux)
    needs: [scope-gate, gates]
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the shipped binary
        id: cli
        uses: ./.github/actions/build-cli
        with:
          config: release
          dest: target/x86_64-unknown-linux-gnu/release
          cache-key: release-x86_64-unknown-linux-gnu
          tailscale-client-id: ${{ github.repository == 'ScriptedAlchemy/tracedecay' && github.actor_id == '25274700' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.TS_BAZEL_CLIENT_ID || '' }}

      - name: Read immutable packaging inputs
        id: packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package and exercise the shipped artifacts
        uses: ./.github/actions/package-release
        with:
          binary: ${{ steps.cli.outputs.path }}
          tag: ${{ steps.packaging.outputs.tag }}
          asset-prefix: tracedecay-${{ steps.packaging.outputs.tag }}
          platform: x86_64-linux
          archive: tar.gz
          epoch: ${{ steps.packaging.outputs.epoch }}

  # Frontend checks require no Rust compilation and must also validate drafts.
  # Do not serialize them behind repository-wide Rust formatting and gates.
  dashboard:
    name: Dashboard
    needs: [scope-gate, gates]
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: ./.github/actions/setup-pnpm

      - name: Typecheck dashboard consumers
        working-directory: dashboard
        run: pnpm run typecheck

      - name: Typecheck TypeScript SDK
        working-directory: sdks/typescript
        run: pnpm run typecheck

      - name: Run TypeScript SDK unit tests
        working-directory: sdks/typescript
        run: pnpm test

      - name: Build dashboard assets
        working-directory: dashboard
        run: pnpm run build

      - name: Run dashboard unit tests
        working-directory: dashboard
        run: pnpm test

      # The dashboard is one rsbuild app emitting `app-dist/` (the legacy
      # shell/holographic/lcm/graph/savings bundle split no longer exists), so
      # the bundle validator is the artifact authority and the determinism
      # check hashes whatever the build actually produced.
      - name: Verify embedded dist artifacts
        working-directory: dashboard
        run: |
          set -euo pipefail
          python3 ../scripts/check-dashboard-bundle.py app-dist
          (cd app-dist && find . -type f | sort | xargs sha256sum) > /tmp/dashboard-dist.sha
          pnpm run build
          (cd app-dist && find . -type f | sort | xargs sha256sum) | diff /tmp/dashboard-dist.sha -

      - name: Build TypeScript SDK for the ChatGPT extension
        working-directory: sdks/typescript
        run: pnpm run build

      - name: Typecheck ChatGPT extension
        working-directory: plugin/chatgpt-extension
        run: pnpm run typecheck

      # extension.test.ts needs a tracedecay binary, which this job does not
      # build; the adapter tests run against a fake `serve`.
      - name: Run ChatGPT extension adapter tests
        working-directory: plugin/chatgpt-extension
        run: pnpm exec vitest run test/adapter.test.ts

      - name: Verify ChatGPT extension embedded artifacts
        working-directory: plugin/chatgpt-extension
        run: pnpm run check:embedded

  hermes-integration:
    name: Hermes integration (stock)
    needs: [scope-gate, debug-cli]
    if: ${{ needs.scope-gate.outputs.run-hosts == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_ARM_RUNNER || 'ubuntu-26.04-arm' }}
    timeout-minutes: 30
    env:
      # Stock (upstream) Hermes pin. The generated plugin must keep working
      # against this exact upstream commit. Bump deliberately after rerunning
      # scripts/hermes_stock_integration.sh against the new ref locally.
      HERMES_UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
      HERMES_UPSTREAM_REF: 9dd9ef0ec99a87f078f7272b4323df5440b4b3f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Run generated-plugin unit checks (no Hermes required)
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: python3 scripts/hermes_plugin_unit_check.py

      - name: Clone stock Hermes at pinned ref
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes-upstream"
          git -C "$RUNNER_TEMP/hermes-upstream" remote add origin "$HERMES_UPSTREAM_REPO"
          git -C "$RUNNER_TEMP/hermes-upstream" fetch --depth 1 origin "$HERMES_UPSTREAM_REF"
          git -C "$RUNNER_TEMP/hermes-upstream" checkout --detach FETCH_HEAD

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/hermes-upstream/uv.lock
          cache-suffix: hermes-${{ env.HERMES_UPSTREAM_REF }}

      - name: Set up stock Hermes environment
        working-directory: ${{ runner.temp }}/hermes-upstream
        run: uv sync --frozen --no-dev

      - name: Run stock Hermes integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
          HERMES_UPSTREAM_DIR: ${{ runner.temp }}/hermes-upstream
        run: scripts/hermes_stock_integration.sh

  host-stock-integration:
    name: Claude Code + OpenCode integration (stock)
    needs: [scope-gate, debug-cli]
    if: ${{ needs.scope-gate.outputs.run-hosts == 'true' }}
    runs-on: ${{ vars.DEPOT_LINUX_ARM_RUNNER || 'ubuntu-26.04-arm' }}
    timeout-minutes: 30
    env:
      # Stock host pins. The installed bundle must keep working against these
      # exact host releases. Bump deliberately after rerunning
      # scripts/claude_stock_integration.sh and
      # scripts/opencode_stock_integration.sh against the new versions locally.
      CLAUDE_CODE_VERSION: 2.1.296
      OPENCODE_VERSION: 2.0.28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Install stock Claude Code and OpenCode at pinned versions
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@opencode/cli@${OPENCODE_VERSION}"
          claude --version
          opencode --version

      - name: Run MCP conformance smoke
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/mcp-conformance-smoke.sh

      - name: Run stock Claude Code integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/claude_stock_integration.sh

      - name: Run stock OpenCode integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/opencode_stock_integration.sh
