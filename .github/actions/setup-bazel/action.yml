name: Set up Bazel
description: >
  Installs Bazel through the pinned bazelisk with its repository cache, and a
  disk cache named by `cache-key`. Jobs with the same configuration and
  runner image share a restore prefix. Callers retain compiled actions on
  master and may also save within a PR's merge-ref scope for later pushes to
  that same PR. Bazelisk and repository caches are saved on master, and
  also by `save-download-caches` jobs on runners with a remote cache.
  Restores MODULE.bazel.lock; callers save it with the `module-lockfile-*`
  outputs once their first Bazel command succeeds.
  Test runtimes are declared Bazel inputs.
  Runners with their own remote Bazel cache (Depot) keep it and skip the
  disk-cache archive.

inputs:
  cache-key:
    description: Disk-cache name; jobs with the same runner image and flags share it.
    required: true
  extra-restore-keys:
    description: >
      Comma-separated extra disk-cache names restored after this job's own
      prefix misses. Use when two jobs share rustc flags and runner image so
      Clippy can reuse Test Linux action outputs.
    default: ""
  save-download-caches:
    description: >
      Also save the bazelisk and repository caches off master when the
      runner's remote cache is in use. Depot keeps these in its own cache
      store, which cannot read the GitHub-stored master entries; one
      designated job per platform sets this.
    default: "false"
  tailscale-client-id:
    description: OIDC client for trusted Linux CI; empty keeps the hosted-only build.
    default: ""

outputs:
  fleet-enabled:
    description: Whether this job uses private workers and dynamic execution.
    value: ${{ github.repository == 'ScriptedAlchemy/tracedecay' && inputs.tailscale-client-id != '' }}
  disk-cache-path:
    description: Action-cache directory to save after the caller's build.
    value: ${{ steps.disk-cache-config.outputs.path }}
  disk-cache-key:
    description: Run-specific save key returned by the cache restore action.
    value: ${{ steps.disk-cache.outputs.cache-primary-key }}
  remote-cache:
    description: "`true` when the runner's own remote Bazel cache is in use."
    value: ${{ steps.disk-cache-config.outputs.remote-cache }}
  module-lockfile-key:
    description: >
      Save key for MODULE.bazel.lock. A designated caller saves the file with
      actions/cache/save right after its first Bazel command succeeds, so a
      later test failure in the same job cannot discard a completed splice.
    value: ${{ steps.module-lockfile.outputs.cache-primary-key }}
  module-lockfile-hit:
    description: "`true` when the exact lockfile key was restored; nothing to save."
    value: ${{ steps.module-lockfile.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # crate_universe's cargo checks out git dependencies under D:/b; asupersync
    # carries paths past MAX_PATH there, which libgit2 refuses without this.
    - name: Allow long git paths
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.longpaths true
        git config --system core.longpaths true

    # Cache versions include the literal path. Keep setup-bazel's existing
    # directory and key prefix to restore previously compiled outputs.
    - name: Resolve action cache location
      id: disk-cache-config
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-key }}
        EXTRA_RESTORE_KEYS: ${{ inputs.extra-restore-keys }}
        RUNNER_BAZELRC: ${{ runner.temp }}/runner.bazelrc
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const os = require('node:os');
        // A short output base on the workspace drive: D: on GitHub images.
        const drive = (process.env.GITHUB_WORKSPACE || 'D:').slice(0, 2).toUpperCase();
        const outputBase = process.platform === 'win32' ? `${drive}/b` : '';
        const path = process.platform === 'win32'
          ? `${outputBase}-disk`
          : `${os.homedir().replace(/\\/g, '/')}/.cache/bazel-disk`;
        // setup-bazel truncates the user bazelrc. Keep a runner-provided
        // remote cache (Depot writes its endpoint and credentials there) in
        // a private file and mask its headers; never echo the contents.
        // Without one, use Depot's documented per-job DEPOT_CACHE_TOKEN.
        const hasRemote = (rc) => fs.existsSync(rc) && /--remote_cache=/.test(fs.readFileSync(rc, 'utf8'));
        const rcPaths = [...new Set([os.homedir(), process.env.HOME]
          .filter(Boolean)
          .map((home) => `${home.replace(/\\/g, '/')}/.bazelrc`))];
        const userRc = rcPaths.find(hasRemote);
        // Bazel reads the system rc itself and setup-bazel leaves it intact.
        const systemRc = process.platform === 'win32'
          ? `${(process.env.ProgramData || 'C:/ProgramData').replace(/\\/g, '/')}/bazel.bazelrc`
          : '/etc/bazel.bazelrc';
        const token = process.env.DEPOT_CACHE_TOKEN;
        if (token) console.log(`::add-mask::${token}`);
        let source = 'none';
        let runnerRc;
        if (userRc) {
          source = userRc;
          runnerRc = fs.readFileSync(userRc, 'utf8');
        } else if (hasRemote(systemRc)) {
          source = systemRc;
          runnerRc = '';
        } else if (token) {
          source = 'DEPOT_CACHE_TOKEN';
          runnerRc = 'build --remote_cache=https://cache.depot.dev\n'
            + `build --remote_header=authorization=${token}\n`;
        }
        for (const text of [runnerRc, hasRemote(systemRc) && fs.readFileSync(systemRc, 'utf8')]) {
          for (const [, value] of (text || '').matchAll(/--remote_header=[^=\s]+=(.+)$/gm)) {
            for (const secret of [value, ...value.split(/[\s"']+/)]) {
              if (secret.trim().length >= 8) console.log(`::add-mask::${secret.trim()}`);
            }
          }
        }
        if (runnerRc !== undefined) {
          fs.writeFileSync(process.env.RUNNER_BAZELRC, runnerRc, { mode: 0o600 });
        }
        console.log(`Remote Bazel cache source: ${source}; user rc candidates: ${rcPaths.join(', ')}; `
          + `system rc ${fs.existsSync(systemRc) ? 'present' : 'absent'}; `
          + `DEPOT_CACHE_TOKEN ${token ? 'set' : 'unset'}`);
        // MODULE.bazel.lock holds absolute checkout paths (crate_universe
        // mirrors the patches/ path crates from them), so a lockfile only
        // fits jobs on the same host type that check out to the same
        // directory.
        const checkout = require('node:crypto').createHash('sha256')
          .update(process.env.GITHUB_WORKSPACE || '').digest('hex').slice(0, 16);
        const names = [process.env.CACHE_NAME, ...(process.env.EXTRA_RESTORE_KEYS || '')
          .split(',')
          .map((name) => name.trim())
          .filter(Boolean)];
        const prefixes = names.map((name) =>
          `setup-bazel-1-${process.platform}-${os.arch()}-disk-${name}-`);
        fs.appendFileSync(
          process.env.GITHUB_OUTPUT,
          `path=${path}\nprefix=${prefixes[0]}\nrestore-keys<<EOF\n${prefixes.join('\n')}\nEOF\n`
            + `output-base=${outputBase}\nremote-cache=${runnerRc !== undefined}\n`
            + `bazelrc-paths=${JSON.stringify(rcPaths)}\n`
            + `module-lockfile-prefix=bazel-module-lockfile-v1-${process.platform}-${process.arch}-${checkout}-\n`,
        );
        JS

    # Without MODULE.bazel.lock, the first Bazel command of every job re-runs
    # the crate_universe splice, about four minutes before loading starts
    # (run 38644661902, every platform). The file is gitignored, so carry it
    # in the Actions cache. Bazel checks every recorded input (Cargo.lock,
    # the Cargo manifests, CARGO_BAZEL_* variables, repository mappings) and
    # re-evaluates on a mismatch, so a stale restore costs only that splice.
    - name: Restore the Bazel module lockfile
      id: module-lockfile
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: MODULE.bazel.lock
        key: >-
          ${{ steps.disk-cache-config.outputs.module-lockfile-prefix }}timeout-${{ env.CARGO_BAZEL_TIMEOUT }}-${{
          hashFiles('MODULE.bazel', '.bazelversion', 'Cargo.lock', 'Cargo.toml',
          'crates/**/Cargo.toml', 'patches/**/Cargo.toml') }}
        restore-keys: ${{ steps.disk-cache-config.outputs.module-lockfile-prefix }}

    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        repository-cache: true
        disk-cache: false
        # A remote cache replaces the multi-GB disk-cache archive.
        bazelrc: >-
          ${{ steps.disk-cache-config.outputs.remote-cache != 'true'
          && !(github.repository == 'ScriptedAlchemy/tracedecay' && inputs.tailscale-client-id != '')
          && format('build --disk_cache={0}', steps.disk-cache-config.outputs.path) || '' }}
        cache-save: >-
          ${{ github.ref == 'refs/heads/master'
          || (inputs.save-download-caches == 'true'
          && steps.disk-cache-config.outputs.remote-cache == 'true') }}
        # Windows build-script runfiles nest each vendored crate's sources
        # under its repository name twice; a short output base (default
        # D:/_bazel) keeps MSVC's header paths under MAX_PATH.
        output-base: ${{ steps.disk-cache-config.outputs.output-base }}

    - name: Restore the runner's remote cache configuration
      if: steps.disk-cache-config.outputs.remote-cache == 'true'
      shell: bash
      env:
        RUNNER_BAZELRC: ${{ runner.temp }}/runner.bazelrc
        BAZELRC_PATHS: ${{ steps.disk-cache-config.outputs.bazelrc-paths }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const runnerRc = fs.readFileSync(process.env.RUNNER_BAZELRC, 'utf8');
        // .bazelrc's --announce_rc would print these credential-bearing
        // options; the user rc loads after it, so this override wins.
        for (const rc of JSON.parse(process.env.BAZELRC_PATHS)) {
          fs.appendFileSync(rc, `\n${runnerRc}\ncommon --noannounce_rc\n`);
        }
        fs.rmSync(process.env.RUNNER_BAZELRC);
        JS

    # Bazel validates action contents itself. A fresh save key retains new
    # source-build outputs even when MODULE.bazel and BUILD files are unchanged.
    - name: Restore compiled action cache
      id: disk-cache
      if: steps.disk-cache-config.outputs.remote-cache != 'true' && !(github.repository == 'ScriptedAlchemy/tracedecay' && inputs.tailscale-client-id != '')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.disk-cache-config.outputs.path }}
        key: ${{ steps.disk-cache-config.outputs.prefix }}run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: ${{ steps.disk-cache-config.outputs.restore-keys }}

    - name: Connect to the private Bazel fleet
      if: github.repository == 'ScriptedAlchemy/tracedecay' && inputs.tailscale-client-id != ''
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: api.tailscale.com/${{ inputs.tailscale-client-id }}
        tags: tag:bazel-ci
        ping: ubuntu-main

    - name: Share compilation and tests with private workers
      if: github.repository == 'ScriptedAlchemy/tracedecay' && inputs.tailscale-client-id != ''
      shell: bash
      run: |
        if [[ $RUNNER_OS != Linux || $RUNNER_ARCH != X64 ]]; then
          echo 'The CI fleet configuration requires a Linux x86_64 runner.' >&2
          exit 1
        fi
        mkdir -p /tmp/zig-cache
        # Use the checkout's existing local rc import for fleet settings.
        # Tests carry their tools in runfiles, so both branches use identical inputs.
        cat > .bazelrc.local <<'RC'
        build --config=rbe-linux
        build --remote_executor=grpc://ubuntu-main:50051
        build --remote_cache=grpc://ubuntu-main:50051
        build --remote_instance_name=main
        build --remote_timeout=600
        build --remote_local_fallback
        build --remote_download_outputs=toplevel
        build --jobs=40
        build --local_resources=cpu=HOST_CPUS
        build --local_resources=memory=HOST_RAM*.5
        build --internal_spawn_scheduler
        build --dynamic_local_strategy=sandboxed
        build --dynamic_remote_strategy=remote
        build --strategy=Rustc=dynamic
        build --strategy=TestRunner=dynamic
        build --bes_backend=grpc://ubuntu-main:1985
        build --bes_results_url=https://ubuntu-main.tail039078.ts.net/invocation/
        build --bes_timeout=30s
        build --bes_upload_mode=fully_async
        RC
