name: Build the tracedecay CLI
description: >-
  Build //crates/tracedecay-cli:tracedecay with Bazel and stage it and any
  requested NCM worker bundle for packaging, upload, or runtime verification.

inputs:
  config:
    description: >-
      Bazel config. `dist` is the shipping-tuned compile (thin LTO, strip,
      codegen-units=1). `release` is opt-level 3 without LTO;
      tracedecay-cli's default features are
      `production`, the release source profile. `ci` is a dev-profile build.
    required: true
  dest:
    description: Directory the binary is copied into, as tracedecay[.exe].
    required: true
  cache-key:
    description: Disk-cache name (see the setup-bazel action).
    required: true
  ncm-worker:
    description: Stage the generated NCM worker bundle for a supported release target.
    required: false
    default: 'false'
  save-module-lockfile:
    description: Save MODULE.bazel.lock right after a successful build when its exact key missed.
    required: false
    default: 'false'
  tailscale-client-id:
    description: Restricted OIDC client for compatible trusted CI builds.
    default: ""

outputs:
  path:
    description: The staged binary.
    value: ${{ steps.stage.outputs.path }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel
      id: bazel
      with:
        cache-key: ${{ inputs.cache-key }}
        tailscale-client-id: ${{ inputs.tailscale-client-id }}

    - name: Build and stage the binary
      id: stage
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        DEST: ${{ inputs.dest }}
        NCM_WORKER: ${{ inputs.ncm-worker }}
      run: |
        set -euo pipefail
        exe=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          exe=".exe"
        fi
        targets=(//crates/tracedecay-cli:tracedecay)
        case "$NCM_WORKER" in
          true) targets+=(//product/ncm:worker_bundle) ;;
          false) ;;
          *) echo "::error::ncm-worker must be true or false"; exit 1 ;;
        esac
        # A cold repository cache downloads every external repository. Bazel
        # retries a 5xx for only ~17 s, and a longer GitHub release-host outage
        # failed beta.86's macOS build (#3756). Analysis fetches every
        # repository and the next command refetches a failed one, so retry
        # only that phase, over about six minutes.
        for attempt in 1 2 3 4; do
          bazel build --nobuild --config="$CONFIG" --config=ci "${targets[@]}" && break
          (( attempt < 4 )) || exit 1
          sleep $((attempt * 60))
        done
        bazel build --config="$CONFIG" --config=ci "${targets[@]}"
        bazel_bin="$(bazel info --config="$CONFIG" --config=ci bazel-bin)"
        mkdir -p "$DEST"
        cp "$bazel_bin/crates/tracedecay-cli/tracedecay${exe}" "$DEST/tracedecay${exe}"
        chmod u+w "$DEST/tracedecay${exe}"
        if [[ "$NCM_WORKER" == true ]]; then
          mkdir -p "$DEST/ncm-worker"
          cp "$bazel_bin/product/ncm/worker-bundle/tracedecay-ncm-worker${exe}" \
            "$DEST/ncm-worker/tracedecay-ncm-worker${exe}"
          cp "$bazel_bin/product/ncm/worker-bundle/worker-manifest.json" \
            "$DEST/ncm-worker/worker-manifest.json"
          cp "$bazel_bin/product/ncm/worker-bundle/model-acquisition-manifest.json" \
            "$DEST/ncm-worker/model-acquisition-manifest.json"
        fi
        echo "path=${GITHUB_WORKSPACE}/${DEST}/tracedecay${exe}" >> "$GITHUB_OUTPUT"

    - name: Save the Bazel module lockfile
      if: inputs.save-module-lockfile == 'true' && steps.bazel.outputs.module-lockfile-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: MODULE.bazel.lock
        key: ${{ steps.bazel.outputs.module-lockfile-key }}

    # Cargo's macOS link wrapper gave the product a stable ad-hoc identity;
    # Bazel links directly, so sign the staged file the way install.sh and
    # `tracedecay update` do.
    - name: Sign the macOS binary
      if: runner.os == 'macOS'
      shell: bash
      run: scripts/macos-stable-codesign.sh "${{ steps.stage.outputs.path }}"

    - name: Save compiled Bazel actions
      if: always() && !cancelled() && github.ref == 'refs/heads/master' && steps.bazel.outputs.disk-cache-key != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.bazel.outputs.disk-cache-path }}
        key: ${{ steps.bazel.outputs.disk-cache-key }}
